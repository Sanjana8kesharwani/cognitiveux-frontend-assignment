<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="ICICI Bank Credit Cards - Exclusive Privileges replica built with pure HTML, CSS, and Vanilla JavaScript." />
  <title>ICICI Bank Credit Cards - Exclusive Privileges</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Mulish Font family matches original website -->
  <link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <!-- Exclusive Privileges Section Replica -->
    <section class="exclusive" id="exclusivePrivilegesSection">
      <div class="container p-0 p-md-3">
        <h2>Exclusive Privileges</h2>
        
        <!-- Custom 3D Slider Container -->
        <div class="swiper-container" id="exclusiveSlider">
          <div class="swiper-wrapper" id="sliderWrapper">
            
            <!-- Slide 1: Ixigo Voucher -->
            <div class="swiper-slide">
              <div class="slide slide1">
                <p>Get</p>
                <h3>Activation voucher</h3>
                <p>with <br />Flat ₹1,200/- off.</p>
                <img src="assets/images/ixigo.webp" alt="logo ixigo" width="138" height="64" loading="lazy" />
              </div>
            </div>
            
            <!-- Slide 2: Reliance Digital Voucher -->
            <div class="swiper-slide">
              <div class="slide slide2">
                <p>Get</p>
                <h3>Activation voucher</h3>
                <p>with up to<br /> ₹1,500/- off*.</p>
                <img src="assets/images/reliance_digital.webp" alt="logo reliance digital" width="236" height="103" loading="lazy" />
              </div>
            </div>
            
            <!-- Slide 3: BookMyShow Benefits -->
            <div class="swiper-slide">
              <div class="slide slide3">
                <h3>Enjoy Benefits</h3>
                <p>worth up to <br />₹500/- off* <br />on your tickets.</p>
                <img src="assets/images/bms.webp" alt="logo bookmyshow" width="226" height="67" loading="lazy" />
                <em>*available on selected cards</em>
              </div>
            </div>
            
            <!-- Slide 4: Apple Offer -->
            <div class="swiper-slide">
              <div class="slide slide4">
                <p>Avail</p>
                <h3>APPLE OFFER</h3>
                <p>with up to<br /> ₹7,000/- off</p>
              </div>
            </div>
            
          </div>
          
          <!-- Custom Navigation Arrows -->
          <div class="swiper-button-prev" id="prevSlideButton" role="button" aria-label="Previous slide" tabindex="0"></div>
          <div class="swiper-button-next" id="nextSlideButton" role="button" aria-label="Next slide" tabindex="0"></div>
          
          <!-- Custom Pagination Bullets (Visible on Mobile) -->
          <div class="swiper-pagination" id="sliderPagination"></div>
        </div>
        
      </div>
    </section>
  </main>
  
  <script src="script.js"></script>
</body>
</html>
